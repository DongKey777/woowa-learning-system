[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "woowa-learning-system"
version = "2.0.0"
description = "paradigm-v2 RAG-based learning coach for Woowa missions (BGE-M3 + Lance)"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies actually imported by the learning loop. Floors are the
# versions this archive was built and verified against; pip is free to resolve
# newer compatible wheels per platform (macOS MPS / Linux / Windows).
# NOTE: BGE-M3 is loaded via transformers + sentence-transformers, NOT the
# FlagEmbedding package — FlagEmbedding only appears inside the RunPod build
# script's install string (scripts/remote_build.py), so it is not a learner dep.
dependencies = [
    "numpy>=2.4.4",
    "pyarrow>=24.0.0",
    "lancedb>=0.30.2",
    "sentence-transformers>=5.4.0",
    "transformers>=5.5.4",
    "torch>=2.11.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# System development / CI (Mode B).
dev = [
    "pytest>=7.0",
    "pandas>=2.3.0",
    "pylance>=0.38.0",
]
# Maintainer-only RunPod index rebuild (bin/rag-remote-build).
remote = ["runpod"]

[tool.setuptools.packages.find]
# Flat layout: the importable packages live at the repo root. Listing them
# explicitly avoids setuptools' "multiple top-level packages" auto-discovery
# error and keeps data dirs (corpus/, migration/, state/) out of the install.
include = ["core*", "rag*", "scripts*", "mission*", "anchors*", "curation*"]
namespaces = false
